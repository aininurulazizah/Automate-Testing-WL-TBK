name: Run Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: "Spec file yang mau dijalankan"
        required: false
        default: ""

      keyword:
        description: "Keyword test title (Playwright --grep)"
        required: false
        default: ""
        
  schedule:
    - cron: "0 19 * * *"

jobs:
