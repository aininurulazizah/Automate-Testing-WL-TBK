      - name: Check if last day of month
        id: month_check
        run: |
          TODAY=$(TZ=Asia/Jakarta date +%Y-%m-%d)
          TOMORROW=$(TZ=Asia/Jakarta date -d "$TODAY + 1 day" +%Y-%m-%d)
          TODAY_MONTH=$(TZ=Asia/Jakarta date -d "$TODAY" +%Y-%m)
          TOMORROW_MONTH=$(TZ=Asia/Jakarta date -d "$TOMORROW" +%Y-%m)

          echo "Today: $TODAY"
          echo "Tomorrow: $TOMORROW"
          echo "This month: $TODAY_MONTH"

          if [ "$TODAY" = "2026-09-25" ]; then
            echo "is_month_end=true" >> "$GITHUB_OUTPUT"
            echo "Today is the LAST DAY of the month."
          else
            echo "is_month_end=false" >> "$GITHUB_OUTPUT"
            echo "Today is NOT the last day of the month."
          fi

      - name: Create Monthly Execution ZIP
        if: steps.month_check.outputs.is_month_end == 'true'
        id: monthly_zip
        run: |
          TODAY=$(TZ=Asia/Jakarta date +%Y-%m-%d)
          MONTH=$(TZ=Asia/Jakarta date -d "$TODAY" +%Y-%m)

          ZIP_NAME="monthly-executions-${MONTH}.zip"

          echo "Creating monthly archive for: $MONTH"
          echo "ZIP name: $ZIP_NAME"

          mkdir -p monthly-archive

          find dashboard/src/data/executions \
            -maxdepth 1 \
            -type f \
            -name "${MONTH}-*.json" \
            -exec cp {} monthly-archive/ \;

          echo ""
          echo "Files included in monthly archive:"
          ls -lah monthly-archive

          FILE_COUNT=$(find monthly-archive \
            -type f \
            -name "*.json" \
            | wc -l)

          echo ""
          echo "Total execution files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No execution files found for ${MONTH}"
            exit 1
          fi

          zip -j "$ZIP_NAME" monthly-archive/*.json

          echo ""
          echo "Monthly ZIP created:"
          ls -lh "$ZIP_NAME"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

